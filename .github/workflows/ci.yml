name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://jobflow:jobflow@localhost:5432/jobflow
  TEST_DATABASE_URL: postgresql://jobflow:jobflow@localhost:5432/jobflow_test
  JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-0000000
  JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-000000
  NODE_ENV: test

jobs:
  test:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobflow
          POSTGRES_PASSWORD: jobflow
          POSTGRES_DB: jobflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Create test database
        run: PGPASSWORD=jobflow psql -h localhost -U jobflow -c 'CREATE DATABASE jobflow_test'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Apply migrations
        run: npm run db:deploy -w @jobflow/api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: End-to-end tests
        run: npm run e2e
        env:
          NODE_ENV: production

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
